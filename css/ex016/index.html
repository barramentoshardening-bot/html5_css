<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: larry ;
            src: url('fontes/Filxgirl.TTF') format('truetype'), url('fontes/Filxgirl.TTF');
            font-weight: normal;
            font-style: normal;
            /*
                Tipos de format 
                - opentype (otf)
                -truetype (ttf)
                -embedded-opentype
                -truetype-aat(aplle Advanced Typography)
                svg
            */
        }
        body {
            font-family: Arial,Helvetica, sans-serif;
        }
        h1 {
            font-family: larry, 'Times New Roman', Times, serif;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Temporibus illum qui harum velit ex aspernatur est corrupti iure, eos unde sequi aut praesentium libero eveniet, itaque nemo facere fuga? Consequuntur.</p>

</body>
</html>
