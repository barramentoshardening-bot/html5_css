<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="img/titulo-P.png">
        <source media="(max-width: 1050)" srcset="img/foto-M.png">
        <img src="img/foto-G.png" alt="Imagem flexíel">
    </picture>

    <h1>Reproduzindo audio</h1>
    <p>Aprendendo a reproduzir audio</p>
    <audio preload="metadata" autoplay controls>
        <source src="audio/happy-mistake.mp3" type="audio/mpeg">
    </audio>

    
</body>
</html>
